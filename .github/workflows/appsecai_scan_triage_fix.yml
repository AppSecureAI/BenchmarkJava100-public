name: Scan Triage and Remediation
permissions:
  contents: read
  id-token: write
on:
  workflow_dispatch:
jobs:
  triageAndRemediation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep-results.sarif .
      - name: AppSecAI
        uses: AppSecureAI/automation-action@990e0d942fc87d65619ee873148de955434c69a5 # v1
        with:
          file: semgrep-results.sarif
